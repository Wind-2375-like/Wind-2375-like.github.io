name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # removed md files that include liquid tags, plus the theme's sample posts/pages and docs (URL excludes are in lychee.toml)
          args: >-
            --exclude-path README.md --exclude-path _pages/404.md --exclude-path _pages/blog.md
            --exclude-path _posts/_posts_template --exclude-path _pages/about_einstein.md
            --exclude-path CUSTOMIZE.md --exclude-path FAQ.md --exclude-path INSTALL.md --exclude-path CONTRIBUTING.md
            --verbose --no-progress './**/*.md' './**/*.html'

      - name: Report broken links 📝
        # Show each failing link as an annotation on the commit, next to the check
        if: ${{ failure() }}
        run: |
          awk '/^### Errors in /{f=substr($0,15)} /^\* \[/{sub(/^\* /,""); print "::error title=Broken link in " f "::" $0}' lychee/out.md | head -50
